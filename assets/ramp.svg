<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">A target position entering a TMC5240, which runs the whole ramp itself</title>
  <desc id="d">A target position is handed to a TMC5240 and the chip drives the motor through a trapezoidal velocity ramp on its own, with no step pulse from the host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#102f34"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font-family: ui-monospace, monospace; font-size: 13px; fill: #9edbc4; letter-spacing: 1px; }
      .blk  { font-family: ui-monospace, monospace; font-size: 15px; fill: #e8f5ef; letter-spacing: 1.5px; }
      .sml  { font-family: ui-monospace, monospace; font-size: 11px; fill: #9edbc4; letter-spacing: 1px; }
      .wire { stroke: #51c99c; stroke-width: 2.4; fill: none; opacity: .78; }
      .box  { fill: none; stroke: #70e1b2; stroke-width: 2.2; opacity: .88; }
      .grid { stroke: #234a52; stroke-width: 1; opacity: .55; }
      .amb  { stroke: #f2bd68; stroke-width: 2.2; fill: none; }
      .sp   { stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      .trace { fill: none; stroke: #70e1b2; stroke-width: 3.2;
               stroke-dasharray: 1000; stroke-dashoffset: 1000;
               animation: draw 6s linear infinite; }
      .trace2{ fill: none; stroke: #f2bd68; stroke-width: 2.6; opacity: .9;
               stroke-dasharray: 1000; stroke-dashoffset: 1000;
               animation: draw 6s linear infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 72% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .trace, .trace2 { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="900" height="400" rx="26" fill="url(#bg)"/>

  <text class="lbl" x="70" y="52">XTARGET</text>
  <path id="cmd" class="wire" d="M70 116H196"/>
  <rect class="box" x="196" y="74" width="208" height="84" rx="7"/>
  <text class="blk" x="300.0" y="121.0" text-anchor="middle">TMC5240</text>
  <text class="sml" x="300" y="140" text-anchor="middle">EightPoint ramp generator</text>
  <path class="wire" d="M404 116H520"/>
  <text class="sml" x="462" y="104" text-anchor="middle">256 &#181;steps</text>
  <g transform="translate(586,116)">
    <circle r="56" class="box"/>
    <g>
      <line x1="0" y1="-56" x2="0" y2="56" class="grid"/>
      <line x1="-56" y1="0" x2="56" y2="0" class="grid"/>
      <line x1="0" y1="0" x2="0" y2="-44" class="amb" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                        dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
  <text class="lbl" x="586" y="196" text-anchor="middle">stepper</text>
  <path class="wire" d="M642 116H760"/>
  <rect class="box" x="760" y="96" width="80" height="40" rx="7"/>
  <text class="blk" x="800.0" y="121.0" text-anchor="middle">load</text>
  <text class="lbl" x="70" y="196">no step pulse, no timer</text>
  <circle r="5.5" fill="#f2bd68" filter="url(#g)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#cmd"/>
    </animateMotion>
  </circle>
  <line x1="60" y1="228" x2="840" y2="228" stroke="#234a52" stroke-width="1" opacity=".6"/>
  <g class="grid">
    <line x1="70" y1="250" x2="830" y2="250"/>
    <line x1="70" y1="276" x2="830" y2="276"/>
    <line x1="70" y1="303" x2="830" y2="303"/>
    <line x1="70" y1="330" x2="830" y2="330"/>
    <line x1="70" y1="356" x2="830" y2="356"/>
    <line x1="165" y1="250" x2="165" y2="356"/>
    <line x1="260" y1="250" x2="260" y2="356"/>
